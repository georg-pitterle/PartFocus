[project]
name = "partfocus"
# Die Version steht nur in partfocus/_version.py. So ändert der Release-PR
# keine Datei, auf die CI reagiert (siehe paths-ignore in ci.yml).
dynamic = ["version"]
description = "Übe-Tracks pro Stimme aus MuseScore-Partituren, gerendert mit Muse Sounds"
requires-python = ">=3.11"
dependencies = [
    # Nur QtCore, QtGui und QtWidgets; die Addons würden das Bundle aufblähen.
    "PySide6-Essentials",
    "velopack",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "Pillow"]

[project.scripts]
partfocus-cli = "partfocus.core:main"

[project.gui-scripts]
partfocus = "partfocus.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "partfocus._version.__version__" }

[tool.setuptools.packages.find]
include = ["partfocus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
