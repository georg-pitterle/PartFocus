name: Release

on:
  push:
    branches: [main]
  # Von Hand startbar, etwa um einen geschlossenen Release-PR neu anlegen zu lassen.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Hält einen Release-PR offen. Erst dessen Merge schneidet ein Release:
  # Version hochzählen, Changelog schreiben, taggen, GitHub-Release anlegen.
  #
  # Das Release entsteht als Entwurf (siehe release-please-config.json) und wird
  # erst vom Build-Job veröffentlicht, wenn die Pakete angehängt sind. Sonst
  # stünde es für die Minuten des Builds ohne Update-Feed als neueste Version
  # da: Eine installierte Kopie fände nichts, und ein fehlgeschlagener Build
  # hinterließe ein leeres Release.
  #
  # Braucht zusätzlich zu den Rechten oben eine einmalige Repo-Einstellung:
  # Settings -> Actions -> General -> Workflow permissions ->
  # "Allow GitHub Actions to create and approve pull requests".
  # Ohne sie scheitert der Schritt mit "GitHub Actions is not permitted to
  # create or approve pull requests".
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Absichtlich im selben Workflow: Ein mit GITHUB_TOKEN erstellter Tag stößt
  # keine anderen Workflows an, ein `on: release`-Job würde nie starten.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Build bundle
        run: pyinstaller PartFocus.spec --noconfirm

      - name: Self-test the bundle
        # Beweist, dass die gepackte App wirklich läuft (Qt-Plugins, Icon),
        # nicht nur, dass die exe existiert.
        #
        # Start-Process -Wait, weil PartFocus.exe eine Fensteranwendung ist:
        # PowerShell wartet sonst nicht und läse den Bericht, bevor es ihn gibt.
        # timeout-minutes, weil ein unerwarteter Dialog blockieren statt
        # fehlschlagen würde.
        timeout-minutes: 5
        run: |
          $run = Start-Process -FilePath .\dist\PartFocus\PartFocus.exe `
            -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($run.ExitCode -ne 0) { throw "self-test failed with $($run.ExitCode)" }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Fetch the previous release
        # Nur mit dem vorigen Release kann vpk ein Delta-Paket bauen. Beim
        # allerersten Release gibt es keins, das ist kein Fehler.
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        run: >
          vpk pack
          --packId PartFocus
          --packTitle PartFocus
          --packAuthors georg-pitterle
          --packVersion ${{ needs.release-please.outputs.version }}
          --packDir dist\PartFocus
          --mainExe PartFocus.exe
          --icon assets\partfocus.ico

      - name: Attach the packages to the release
        # release-please hat das Release schon angelegt, also die Dateien dort
        # hochladen statt vpk ein zweites anlegen zu lassen.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem Releases -File | ForEach-Object { $_.FullName }
          gh release upload ${{ needs.release-please.outputs.tag_name }} $files --clobber

      - name: Publish the release
        # Absichtlich zuletzt: Installierte Kopien sehen die neue Version erst
        # jetzt, wenn alles für das Update schon da ist.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ needs.release-please.outputs.tag_name }} --draft=false --latest
