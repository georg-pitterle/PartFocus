name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Der Release-PR von release-please ändert nur diese Dateien. Ohne Filter
    # startet CI darauf und GitHub hält den Lauf an ("This workflow is awaiting
    # approval from a maintainer"), weil github-actions[bot] den PR erstellt hat.
    # Eine if-Bedingung im Job hilft nicht, die Sperre greift vorher; nur ein
    # Filter am Auslöser verhindert den Lauf. Tests laufen vor jedem Release
    # ohnehin im Release-Workflow.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - partfocus/_version.py

jobs:
  test:
    # Windows, weil die App nur dort ausgeliefert wird und MuseScore-Pfade
    # und Prozess-Flags Windows-spezifisch sind.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
