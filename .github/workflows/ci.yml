name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Den Release-PR überspringen: Er trägt nur Versionssprung und Changelog,
    # und der Release-Workflow lässt die Tests vor dem Paketieren ohnehin laufen.
    #
    # Am Autor des Pull Requests festgemacht, nie am Branch-Namen: Jeder kann
    # einen Branch 'release-please--...' nennen und bekäme sonst einen PR, in
    # dem stillschweigend keine Tests laufen.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]'
    # Windows, weil die App nur dort ausgeliefert wird und MuseScore-Pfade
    # und Prozess-Flags Windows-spezifisch sind.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
